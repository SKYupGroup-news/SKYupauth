name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # Real Postgres, not a mock: the suite exercises transactions, cascades
      # and raw SQL that an in-memory substitute would not catch.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skyup_auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skyup_auth_test?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skyup_auth_test?schema=public
      JWT_SECRET: ci-secret-long-enough-to-satisfy-the-env-schema-0123456789
      APP_URL: http://localhost:3100
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Fail if a secret was committed
        run: npm run check:secrets
